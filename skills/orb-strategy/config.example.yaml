defaults:
  range_minutes: 15
  entry_window_minutes: 120
  bar_minutes: 5
  buffer_points: 0
  targets_r: [1.0, 2.0]
  filters:
    atr_period: 5
    min_range_atr: null
    max_range_atr: null
    # Activity gate: arm only when the opening range's tick volume is at least this
    # multiple of the same window's mean over the prior lookback sessions. 1.5 is a
    # research-derived prior (expectancy on ORB flipped positive above ~1.0x relative
    # volume in Zarattini & Aziz 2024 — US equities, unverified on CFDs), not an
    # optimized or measured value. Set to null to disable. Requires bars with
    # tick_volume covering the prior lookback sessions' opening windows.
    min_relative_volume: 1.5
    relative_volume_lookback: 10

symbols:
  GER40:
    timezone: Europe/London
    session_open: "08:00"
  US30:
    timezone: America/New_York
    session_open: "09:30"

