[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-agent-strategies"
version = "0.2.0"
description = "Deterministic evaluators wrapped as portable Agent Skills"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
# One command per strategy. Adding a strategy adds one line here.
orb-evaluate = "mt5_agent_strategies.cli:orb_evaluate"
coinflip-evaluate = "mt5_agent_strategies.cli:coinflip_evaluate"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
